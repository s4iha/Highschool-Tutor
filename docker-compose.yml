# =============================================================================
# Local Development Docker Compose for High School Tutor
# Run: docker compose up -d
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: highschool-tutor-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-highschool_tutor_local}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-highschool_tutor_local}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
