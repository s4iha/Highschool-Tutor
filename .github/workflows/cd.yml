name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Publish Docker Image to GHCR
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build & Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_path: ${{ steps.tags.outputs.image_path }}
      docker_tag: ${{ steps.tags.outputs.docker_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repository Image Tag
        id: tags
        run: |
          IMAGE_PATH=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="latest"
          echo "image_path=$IMAGE_PATH" >> $GITHUB_OUTPUT
          echo "docker_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image_path }}:${{ steps.tags.outputs.docker_tag }}
            ${{ steps.tags.outputs.image_path }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Production VPS
  # ---------------------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_IMAGE: ${{ needs.build-and-publish.outputs.image_path }}:${{ needs.build-and-publish.outputs.docker_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_PAT,DEPLOY_IMAGE
          script: |
            set -euo pipefail
            DOCKER_CONFIG_DIR=$(mktemp -d)
            cleanup() {
              rm -rf "$DOCKER_CONFIG_DIR"
            }
            trap cleanup EXIT

            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker --config "$DOCKER_CONFIG_DIR" login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            cd /opt/highschool-tutor
            DOCKER_IMAGE="${DEPLOY_IMAGE:-ghcr.io/username/highschool-tutor:latest}" docker --config "$DOCKER_CONFIG_DIR" compose -f docker-compose.prod.yml --env-file .env up -d --pull always
